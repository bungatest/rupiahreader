<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Rupiah Reader – Pembaca nominal uang kertas dan koin Rupiah layar penuh dengan audio id-ID dan visual kontras tinggi untuk tunanetra dan low vision.">
  <title>Rupiah Reader – Pembaca Nominal Uang Kertas &amp; Koin Rupiah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5.0">
</head>
<body class="camera-fullscreen-theme">
  <a class="skip-link" href="#tap-area">Lewati ke area pemindai</a>

  <!-- Panggung Utama: Kamera Penuh Seluruh Layar (Tanpa Frame Penghalang) -->
  <div id="app-stage" class="stage-fullscreen">
    <video id="camera-preview" autoplay playsinline muted></video>
    
    <button id="tap-area" type="button" aria-label="Ketuk layar di mana saja untuk memindai uang kertas atau koin, ketuk dua kali untuk menjumlahkan">
      <span class="tap-card">
        <span id="reticle-glyph" class="reticle-glyph">💵🪙</span>
        <span id="tap-main-text" class="tap-main-text">Ketuk Layar untuk Memindai</span>
      </span>
    </button>
  </div>

  <canvas id="capture-canvas" hidden></canvas>

  <!-- Antarmuka Terapung Responsif (HUD Kontras Tinggi) -->
  <div class="hud-layer">
    <header class="app-header">
      <div class="header-top-bar">
        <div class="indicators-group">
          <div id="camera-indicator-btn" class="header-indicator" role="button" tabindex="0" aria-label="Status kamera. Klik untuk mengaktifkan ulang kamera">
            <span class="indicator-pip"></span>
            <span class="indicator-text">KAMERA AKTIF</span>
          </div>
          <div id="gpu-indicator" class="header-indicator" role="status" aria-label="Akselerasi hardware GPU">
            <span class="indicator-pip" style="background-color:#0284c7;"></span>
            <span id="gpu-indicator-text" class="indicator-text">GPU AKTIF</span>
          </div>
        </div>
      </div>

      <div class="header-main-row">
        <h1 class="app-title">Rupiah Reader</h1>
      </div>

      <p id="app-tagline" class="app-tagline">Arahkan kamera ke uang (kertas atau koin) lalu ketuk layar di mana saja</p>
      
      <div id="camera-notice" class="camera-notice-banner" hidden>
        <span id="camera-notice-text">Kamera belum aktif. Pastikan izin kamera telah diberikan:</span>
        <button id="btn-open-localhost" class="notice-link-btn" type="button">Aktifkan Kamera</button>
      </div>
    </header>

    <main class="app-main">
      <div class="main-panel-card">
        <!-- Kotak Hasil Wajib Latar #000000 Pekat + Teks Kuning #FFFF00 Raksasa -->
        <section id="result-box" class="result-display" role="status" aria-live="polite" aria-atomic="true">
          <p id="result-label" class="result-title">Hasil Pemindaian</p>
          <p id="result-amount" class="result-number">SIAP MEMINDAI</p>
          <div id="inference-meta" class="inference-meta" aria-hidden="true"></div>
        </section>

        <!-- Ringkasan Akumulasi Total -->
        <div class="total-wrapper">
          <p id="total-display" class="total-value">Total: Rp 0</p>
          <p class="total-gesture-hint" aria-hidden="true">Ketuk 2x Layar = Tambah Total</p>
        </div>
      </div>

      <!-- Live region status sistem khusus screen reader -->
      <p id="sr-status" class="sr-only" aria-live="polite"></p>
    </main>

    <!-- Tombol Aksi Fisik / Pembaca Layar -->
    <footer class="app-footer sr-only">
      <button id="btn-repeat" class="action-btn btn-repeat-style" type="button">
        <span class="btn-glyph" aria-hidden="true">🔊</span>
        <span class="btn-label">Ulangi Suara</span>
      </button>
      <button id="btn-add" class="action-btn btn-add-style" type="button">
        <span class="btn-glyph" aria-hidden="true">➕</span>
        <span class="btn-label">Tambah Total</span>
      </button>
    </footer>
  </div>

  <!-- Script Backend & Interaktivitas -->
  <script src="coin-reader.js?v=5.0"></script>
  <script src="script.js?v=5.0"></script>
</body>
</html>
